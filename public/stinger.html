<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
        }

        /* Orange wipe panel - clips from left */
        #wipe {
            position: absolute;
            top: 0; left: -100%;
            width: 100%;
            height: 100%;
            background: #f07e01;
            clip-path: polygon(0 0, calc(100% - 60px) 0, 100% 50%, calc(100% - 60px) 100%, 0 100%);
            z-index: 2;
        }

        /* Dark fill that follows the wipe */
        #fill {
            position: absolute;
            top: 0; left: -110%;
            width: 110%;
            height: 100%;
            background: #0a0a0a;
            z-index: 1;
        }

        /* Poro */
        #poro {
            position: absolute;
            top: 50%;
            left: -200px;
            transform: translateY(-55%);
            width: 220px;
            height: 220px;
            z-index: 10;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 20px rgba(240, 126, 1, 0.8));
        }

        /* Bounce animation */
        #poro-wrapper {
            position: absolute;
            top: 50%;
            left: -220px;
            transform: translateY(-55%);
            z-index: 10;
        }

        #poro-img {
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 0 20px rgba(240, 126, 1, 0.7));
            animation: bounce 0.25s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0px) rotate(-3deg) scaleX(1.05); }
            to   { transform: translateY(-18px) rotate(3deg) scaleX(0.97); }
        }

        /* Sparkle particles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f07e01;
            z-index: 11;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="fill"></div>
<div id="wipe"></div>

<div id="poro-wrapper">
    <img id="poro-img" src="images/poro.png" alt="poro" />
</div>

<canvas id="sparkles" style="position:absolute;top:0;left:0;width:1920px;height:1080px;z-index:12;pointer-events:none;"></canvas>

<script>
    const DURATION = 2200; // total ms
    const CUT_POINT = 0.5; // fraction where screen is fully covered

    const wipe = document.getElementById('wipe');
    const fill = document.getElementById('fill');
    const poroWrapper = document.getElementById('poro-wrapper');
    const canvas = document.getElementById('sparkles');
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    let particles = [];
    let startTime = null;

    function easeInOut(t) {
        return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    }

    function easeIn(t) {
        return t * t * t;
    }

    function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
    }

    function spawnParticles(x, y) {
        for (let i = 0; i < 3; i++) {
            particles.push({
                x, y: y + (Math.random() - 0.5) * 100,
                vx: (Math.random() * 4 + 2) * (Math.random() > 0.5 ? 1 : -1),
                vy: (Math.random() - 0.5) * 6,
                life: 1,
                size: Math.random() * 12 + 4,
                color: Math.random() > 0.5 ? '#f07e01' : '#ffffff'
            });
        }
    }

    function drawParticles() {
        ctx.clearRect(0, 0, 1920, 1080);
        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            p.life -= 0.04;
        }
        ctx.globalAlpha = 1;
    }

    function animate(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const t = Math.min(elapsed / DURATION, 1);

        const poroX = easeInOut(t) * 2300 - 220;
        poroWrapper.style.left = poroX + 'px';

        // Wipe in: 0 → CUT_POINT
        if (t <= CUT_POINT) {
            const tw = t / CUT_POINT;
            const wipeX = easeIn(tw) * 1920 - 1920;
            const fillX = wipeX - 80;
            wipe.style.left = wipeX + 'px';
            fill.style.left = fillX + 'px';
        } else {
            // Wipe out: CUT_POINT → 1
            const tw = (t - CUT_POINT) / (1 - CUT_POINT);
            const wipeX = easeOut(tw) * 1920;
            const fillX = wipeX - 80;
            wipe.style.left = wipeX + 'px';
            fill.style.left = fillX + 'px';
        }

        // Spawn sparkles near poro feet
        if (t > 0.05 && t < 0.95 && Math.random() > 0.5) {
            spawnParticles(poroX + 110, 540 + 80);
        }

        drawParticles();

        if (t < 1) {
            requestAnimationFrame(animate);
        }
    }

    // Small delay before starting so OBS can init
    setTimeout(() => requestAnimationFrame(animate), 300);
</script>
</body>
</html>
