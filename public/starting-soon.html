<!DOCTYPE html>
<html>
<head>
    <title>Riftbound — Starting Soon</title>
    <style>
        @font-face {
            font-family: 'Cinzel';
            src: url('fonts/Cinzel-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #050810;
            font-family: 'Cinzel', serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(240,126,1,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(240,126,1,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
        }

        .bg-vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 85% 85% at 50% 50%,
                transparent 20%,
                rgba(5, 8, 16, 0.7) 65%,
                rgba(5, 8, 16, 0.97) 100%
            );
        }

        .deco-line-top {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #f07e01, #f5a03a, #f07e01, transparent);
            animation: shimmer 3s ease-in-out infinite;
        }
        .deco-line-bottom {
            position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #f07e01, #f5a03a, #f07e01, transparent);
            animation: shimmer 3s ease-in-out infinite reverse;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .corner { position: absolute; width: 60px; height: 60px; }
        .corner::before, .corner::after {
            content: ''; position: absolute;
            background: #f07e01; opacity: 0.6;
        }
        .corner::before { width: 100%; height: 2px; top: 0; left: 0; }
        .corner::after  { width: 2px; height: 100%; top: 0; left: 0; }
        .corner-tl { top: 30px; left: 30px; }
        .corner-tr { top: 30px; right: 30px; transform: scaleX(-1); }
        .corner-bl { bottom: 30px; left: 30px; transform: scaleY(-1); }
        .corner-br { bottom: 30px; right: 30px; transform: scale(-1); }

        /* ── CONTENT ── */
        .scene {
            position: relative; z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        /* ── PORO ── */
        .poro-wrap {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            animation: fadeInUp 1.2s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        .poro-ring-outer {
            position: absolute;
            width: 640px; height: 640px; border-radius: 50%;
            border: 1px solid rgba(240,126,1,0.25);
            animation: rotateSlow 25s linear infinite;
        }
        .poro-ring-outer::before {
            content: ''; position: absolute;
            width: 10px; height: 10px; border-radius: 50%;
            background: #f07e01; top: -5px; left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 14px #f07e01;
        }

        .poro-ring-inner {
            position: absolute;
            width: 580px; height: 580px; border-radius: 50%;
            border: 1px solid rgba(93,173,226,0.2);
            animation: rotateSlow 18s linear infinite reverse;
        }

        .poro-glow {
            position: absolute;
            width: 520px; height: 520px; border-radius: 50%;
            background: radial-gradient(circle, rgba(93,173,226,0.1) 0%, transparent 70%);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .poro-video {
            width: 480px; height: 480px;
            border-radius: 50%;
            object-fit: cover;
            position: relative; z-index: 2;
            border: 2px solid rgba(240,126,1,0.4);
            mix-blend-mode: multiply;
        }

        /* ── TEXT ── */
        .title {
            font-size: 52px; font-weight: 900; letter-spacing: .25em;
            text-transform: uppercase; color: white;
            text-shadow: 0 0 40px rgba(240,126,1,0.3);
            animation: fadeInUp 1.2s cubic-bezier(0.23, 1, 0.32, 1) both 0.3s;
        }

        .dots span { animation: blink 1.4s infinite; display: inline-block; }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
    <div class="deco-line-top"></div>
    <div class="deco-line-bottom"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="scene">
        <div class="poro-wrap">
            <div class="poro-glow"></div>
            <div class="poro-ring-outer"></div>
            <div class="poro-ring-inner"></div>
            <video class="poro-video" autoplay loop muted playsinline>
                <source src="poro.mp4" type="video/mp4">
            </video>
        </div>

        <div class="title">
            Stream Starting Soon<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

</body>
</html>
