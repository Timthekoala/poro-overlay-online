<!DOCTYPE html>
<html>
<head>
    <title>P1 Decklist Overlay</title>
    <style>
        @font-face {
            font-family: 'Cinzel';
            src: url('fonts/Cinzel-VariableFont_wght.ttf') format('truetype');
        }

        body { 
            margin: 0; padding: 0; width: 1920px; height: 1080px; 
            background: transparent; font-family: 'Cinzel', serif; color: white;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ── NAME BANNER ── */
        .player-banner {
            display: flex; align-items: center; gap: 18px;
            padding: 18px 40px 12px;
            animation: fadeInDown 0.5s ease-out both;
        }
        .player-label {
            font-size: 13px; font-weight: 700; letter-spacing: .25em;
            text-transform: uppercase; color: #5dade2; white-space: nowrap;
        }
        .player-name {
            font-size: 58px; font-weight: 900; letter-spacing: .06em;
            text-transform: uppercase; color: #ffffff; line-height: 1;
            text-shadow: 0 0 32px rgba(41,128,185,0.8), 0 2px 10px rgba(0,0,0,0.9);
        }
        .banner-line {
            flex: 1; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, rgba(41,128,185,0.7), transparent);
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            display: flex; gap: 35px;
            padding: 0 40px 40px;
            flex: 1; overflow: hidden;
        }

        .sidebar { width: 200px; display: flex; flex-direction: column; gap: 15px; }
        .sidebar-item { 
            width: 100%; border: 2px solid #f1c40f; background: rgba(0,0,0,0.85); 
            border-radius: 8px; overflow: hidden; box-shadow: 0 6px 14px rgba(0,0,0,0.5);
            animation: slideInLeft 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
        }
        .sidebar-label { background: #f1c40f; color: black; text-align: center; font-size: 13px; padding: 4px; font-weight: bold; text-transform: uppercase; }
        .sidebar-img { width: 100%; display: block; object-fit: contain; }

        .deck-grid { 
            display: grid; grid-template-columns: repeat(8, 160px); 
            grid-auto-rows: 230px; gap: 20px; flex-grow: 1; align-content: start;
        }

        .card-container { 
            position: relative; width: 160px; opacity: 0;
            animation: fadeInScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        .card-img { width: 100%; border-radius: 8px; border: 1px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .card-count { 
            position: absolute; bottom: -8px; right: -8px;
            background: #111; border: 2px solid #f1c40f; border-radius: 50%;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; color: #f1c40f; z-index: 10;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="player-banner">
        <div class="player-label">Player 1</div>
        <div class="player-name" id="player-name">—</div>
        <div class="banner-line"></div>
    </div>

    <div class="main-content">
        <div class="sidebar" id="sidebar"></div>
        <div class="deck-grid" id="deckGrid"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(window.location.origin);
        let cardIndex = {};

        socket.on('connect', () => { socket.emit('join-overlay'); });

        socket.on('overlay-event', (data) => {
            if (data.p1n !== undefined)
                document.getElementById('player-name').innerText = data.p1n;

            if (data.type === 'updateDeck' && data.player === 'p1') {
                cardIndex = data.index || {};
                renderDeck(data.list);
            }
        });

        function getCardImageHtml(name, count, isSidebar = false, label = "", delay = 0) {
            const originalName = name.replace(/,/g, "").trim();
            const folder = cardIndex[originalName.toLowerCase()] || 'Cards/Origins';
            const finalPath = `images/${folder}/${originalName}.webp`;
            const animStyle = `style="animation-delay: ${delay}s"`;
            if (isSidebar) {
                return `<div class="sidebar-item" ${animStyle}>
                    <div class="sidebar-label">${label}</div>
                    <img class="sidebar-img" src="${finalPath}" onerror="this.src='images/placeholder.png'">
                </div>`;
            } else {
                return `<div class="card-container" ${animStyle}>
                    <img class="card-img" src="${finalPath}" onerror="this.src='images/placeholder.png'">
                    <div class="card-count">${count}</div>
                </div>`;
            }
        }

        function renderDeck(rawText) {
            const grid = document.getElementById('deckGrid');
            const sidebar = document.getElementById('sidebar');
            grid.innerHTML = ''; sidebar.innerHTML = '';
            const sections = rawText.split(/\n(?=[A-Za-z ]+:)/);
            let n = 0;
            sections.forEach(section => {
                const lines = section.trim().split('\n');
                if (!lines.length) return;
                const header = lines.shift().replace(':', '').trim();
                lines.forEach(line => {
                    const match = line.match(/^(\d+)\s+(.+)$/);
                    if (!match) return;
                    const count = match[1], name = match[2].trim();
                    n++;
                    if (header === 'Legend') {
                        sidebar.innerHTML += `<div class="sidebar-item" style="animation-delay:${n*0.05}s">
                            <div class="sidebar-label">Legend</div>
                            <img class="sidebar-img" src="images/Legends/${name.split(',')[0].trim()}.webp" onerror="this.src='images/placeholder.png'">
                        </div>`;
                    } else if (header === 'Champion') {
                        sidebar.innerHTML += getCardImageHtml(name, count, true, "Champion", n * 0.05);
                    } else if (header === 'MainDeck' || header === 'Runes' || header === 'Main Deck') {
                        grid.innerHTML += getCardImageHtml(name, count, false, "", n * 0.05);
                    } else if (header === 'Battlefields') {
                        grid.innerHTML += `<div class="card-container" style="animation-delay:${n*0.05}s">
                            <img class="card-img" src="images/Battlefields/${name.replace(/,/g,'').trim()}.webp" onerror="this.src='images/placeholder.png'">
                            <div class="card-count">${count}</div>
                        </div>`;
                    }
                });
            });
        }
    </script>
</body>
</html>
